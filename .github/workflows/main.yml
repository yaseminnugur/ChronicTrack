name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  expo:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu çek
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.CI_PAT }}

    - name: Node kur
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Dependencies yükle
      working-directory: frontend/ChronicTrackApp
      run: npm install

    - name: Lint kontrolü
      working-directory: frontend/ChronicTrackApp
      run: npm run lint || echo "lint yok"

    - name: Testleri çalıştır
      working-directory: frontend/ChronicTrackApp
      run: npm test

    - name: Expo proje kontrolü
      working-directory: frontend/ChronicTrackApp
      run: npx expo-doctor

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chronictrack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Repo'yu çek
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.CI_PAT }}

    - name: Node kur
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Dependencies yükle
      working-directory: backend
      run: npm install

    - name: Testleri çalıştır
      working-directory: backend
      run: npm test
      env:
        DATABASE_URL: postgresql://root:password@localhost:5432/chronictrack_test
